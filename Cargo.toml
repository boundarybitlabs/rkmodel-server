[workspace]
resolver = "2"
members = [
    "rkmodel-server",
    "rkmodel-server-protocol",
    "rkmodel-server-client",
    "rkmodel-server-openai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
rkmodel-server-protocol = { path = "rkmodel-server-protocol" }
rkmodel-server-client = { path = "rkmodel-server-client" }

tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "fs"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
