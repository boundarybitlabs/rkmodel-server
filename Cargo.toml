[workspace]
resolver = "2"
members = [
    "rkmodel-server",
    "rkmodel-server-protocol",
    "rkmodel-server-client",
    "rkmodel-server-openai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
rkmodel-server-protocol = { path = "rkmodel-server-protocol" }
rkmodel-server-client = { path = "rkmodel-server-client" }

tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "fs"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
minijinja = { version = "2", features = ["loader", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
# Default feature is libloading, which resolves the runtime's symbols by dlopen
# at run time. That keeps librkllmrt off the build host, so the daemon
# cross-compiles for the board from anywhere.
rkllm = { git = "https://github.com/boundarybitlabs/rkllm-rs", branch = "main" }
# rkwhisperd owns the whisper models and their queue; the daemon only proxies to
# it. The client needs rkwhisperd's Unix socket and shared-memory audio ring,
# which is why transcription goes through the daemon and not the frontend.
rkwhisper-client = { git = "https://github.com/boundarybitlabs/rkwhisper", branch = "main" }
